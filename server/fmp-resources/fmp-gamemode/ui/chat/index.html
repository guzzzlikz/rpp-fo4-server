<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чат</title>
<!--
  The gamemode's chat box, replacing FMP's native one (which does not take Cyrillic). Driven by
  src/client/chat.ts:
    page -> script   callEvent("chat:ready"), callEvent("chat:send", "<text>"), callEvent("chat:blur")
    script -> page   "chat:line" { text, color?, author? }, "chat:focus"
    page errors go back as callEvent("chat:error", "<message>") for client\logs\FMP.log
  The page is transparent and full screen; only the box in the corner draws. Lines fade after a while
  unless the player is typing.
-->
<style>
  :root {
    --ink: #e6e6e6;
    --panel: rgba(6, 9, 5, 0.55);
    --line: rgba(232, 245, 220, 0.18);
    --accent: #9be36a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; font: 15px/1.35 "Segoe UI", Roboto, Arial, sans-serif; user-select: none; }

  #box { position: fixed; left: 24px; top: 24vh; width: min(560px, 42vw); }
  #log { display: flex; flex-direction: column; gap: 2px; max-height: 34vh; overflow: hidden; justify-content: flex-end; }
  .msg { color: var(--ink); text-shadow: 0 1px 2px #000, 0 0 4px rgba(0, 0, 0, 0.8); word-wrap: break-word; transition: opacity 0.8s ease; }
  .msg .who { font-weight: 700; margin-right: 6px; }
  .msg.old { opacity: 0; }
  body.typing .msg.old { opacity: 1; }
  body.typing #log { overflow-y: auto; padding-right: 4px; }

  form { margin-top: 8px; display: none; }
  body.typing form { display: block; }
  input {
    width: 100%; height: 36px; padding: 0 12px;
    font: inherit; color: #fff; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .count { margin-top: 3px; font-size: 11px; color: rgba(230, 230, 230, 0.6); text-align: right; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="box">
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" maxlength="200" spellcheck="false" placeholder="Сообщение или /команда">
    <div class="count" id="count"></div>
  </form>
</div>
<script>
  window.addEventListener("error", (event) => callEvent("chat:error", `${event.message} @${event.lineno}`));
  const MAX_LINES = 60, FADE_MS = 12000, MAX_LENGTH = 200;
  const log = document.getElementById("log"), form = document.getElementById("form"), input = document.getElementById("input"), count = document.getElementById("count");
  const history = [];
  let historyAt = 0;

  // 0xRRGGBBAA -> CSS.
  const css = (color) => {
    if (typeof color !== "number" || !isFinite(color)) return null;
    const c = color >>> 0;
    return `rgba(${(c >>> 24) & 255}, ${(c >>> 16) & 255}, ${(c >>> 8) & 255}, ${((c & 255) / 255).toFixed(3)})`;
  };

  function addLine(line) {
    if (!line || typeof line.text !== "string") return;
    const row = document.createElement("div");
    row.className = "msg";
    const color = css(line.color);
    if (color) row.style.color = color;
    if (line.author) {
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = `${line.author}:`;
      row.appendChild(who);
    }
    row.appendChild(document.createTextNode(line.text)); // text, never HTML
    log.appendChild(row);
    while (log.childElementCount > MAX_LINES) log.firstElementChild.remove();
    log.scrollTop = log.scrollHeight;
    setTimeout(() => row.classList.add("old"), FADE_MS);
  }

  let openedAt = 0;

  function openInput() {
    document.body.classList.add("typing");
    input.value = "";
    historyAt = history.length;
    openedAt = Date.now();
    updateCount();
    input.focus();
  }

  // The T that opened the box can land in it as the page takes focus: "t", or "е" on a Russian layout.
  input.addEventListener("beforeinput", (event) => {
    if (Date.now() - openedAt < 150 && input.value === "" && /^[tTеЕ]$/.test(event.data || "")) {
      event.preventDefault();
    }
  });

  function closeInput() {
    document.body.classList.remove("typing");
    input.blur();
  }

  function updateCount() {
    count.textContent = input.value.length > MAX_LENGTH - 40 ? `${input.value.length}/${MAX_LENGTH}` : "";
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    closeInput();
    if (text !== "") {
      history.push(text);
      if (history.length > 30) history.shift();
    }
    callEvent("chat:send", text);
  });

  input.addEventListener("input", updateCount);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      closeInput();
      callEvent("chat:blur", null);
    } else if (event.key === "ArrowUp" && history.length > 0) {
      event.preventDefault();
      historyAt = Math.max(0, historyAt - 1);
      input.value = history[historyAt];
    } else if (event.key === "ArrowDown" && history.length > 0) {
      event.preventDefault();
      historyAt = Math.min(history.length, historyAt + 1);
      input.value = history[historyAt] ?? "";
    }
  });

  window.addEventListener("chat:line", (event) => addLine(event.detail));
  window.addEventListener("chat:focus", () => openInput());

  callEvent("chat:ready", null);
</script>
</body>
</html>
