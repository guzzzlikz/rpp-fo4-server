<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход</title>
<!--
  The login page over the cinematic camera. Driven by src/client/login.ts:
    page -> script   callEvent("login:ready", null), callEvent("login:submit", "{mode, username, password, confirm, characterName}")
    script -> page   "login:state" { username, mode, attemptsLeft, error, busy, done }
  The account is the username typed here, not the launcher's nickname (everyone without one is "Player").
  The background stays transparent: the game is the picture, the page only darkens one side of it.
-->
<style>
  :root {
    --ink: #e8f5dc;
    --dim: rgba(232, 245, 220, 0.62);
    --faint: rgba(232, 245, 220, 0.18);
    --accent: #9be36a;
    --accent-ink: #0d1a08;
    --danger: #ff8f6b;
    --panel: rgba(8, 12, 6, 0.55);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; color: var(--ink); font: 16px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; user-select: none; }

  .shade {
    position: fixed; inset: 0;
    background:
      linear-gradient(90deg, rgba(4, 7, 3, 0.88) 0%, rgba(4, 7, 3, 0.55) 34%, rgba(4, 7, 3, 0) 62%),
      radial-gradient(ellipse at 70% 50%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.45) 100%);
    transition: opacity 0.9s ease;
  }
  .scan { position: fixed; inset: 0; pointer-events: none; opacity: 0.06; background: repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px); }

  main {
    position: fixed; top: 50%; left: clamp(32px, 7vw, 140px);
    width: min(400px, calc(100vw - 64px));
    transform: translateY(-50%);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  body.done main { opacity: 0; transform: translate(-24px, -50%); }
  body.done .shade { opacity: 0; }

  .kicker { font: 600 12px/1 Consolas, "Cascadia Mono", monospace; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
  h1 { margin-top: 14px; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .lead { margin-top: 10px; color: var(--dim); max-width: 34ch; }

  form { margin-top: 30px; padding: 22px; border: 1px solid var(--faint); border-radius: 6px; background: var(--panel); backdrop-filter: blur(6px); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 18px; border: 1px solid var(--faint); border-radius: 5px; }
  .tabs button { height: 34px; margin: 0; font-size: 12px; color: var(--dim); background: transparent; }
  .tabs button.active { color: var(--accent-ink); background: var(--accent); }
  .tabs button:disabled { opacity: 1; }

  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .hint { margin-top: 5px; font-size: 12px; color: var(--dim); }
  .field + .field, .row + .field, .field + .row { margin-top: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--faint); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  input {
    width: 100%; height: 44px; padding: 0 14px;
    font: inherit; color: var(--ink);
    background: rgba(0, 0, 0, 0.4); border: 1px solid var(--faint); border-radius: 4px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155, 227, 106, 0.18); }
  .hidden { display: none; }

  .error { min-height: 20px; margin-top: 12px; font-size: 14px; color: var(--danger); }

  button {
    position: relative; width: 100%; height: 46px; margin-top: 8px;
    font-family: inherit; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 4px; cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.6; cursor: default; }
  button.busy { color: transparent; }
  button.busy::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border: 2px solid var(--accent-ink); border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { margin-top: 14px; font-size: 12px; color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 0s !important; } }
</style>
</head>
<body>
<div class="shade"></div>
<div class="scan"></div>
<main>
  <div class="kicker">Fallout Multiplayer</div>
  <h1 id="title">Добро пожаловать в Содружество</h1>
  <p class="lead" id="lead">Подключение к серверу&hellip;</p>

  <form id="form" autocomplete="off" novalidate>
    <div class="shluxa">У руифа мамашка жирная пиздец</div>  
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" role="tab" disabled>Вход</button>
      <button type="button" id="tab-register" role="tab" disabled>Регистрация</button>
    </div>
    <div class="field">
      <label for="username">Логин</label>
      <input id="username" type="text" maxlength="20" placeholder="yaroslav_99" spellcheck="false" disabled>
      <p class="hint hidden" id="username-hint">3&ndash;20 латинских букв, цифр или _. По нему вы входите, и по нему вас находит администрация.</p>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" type="password" maxlength="128" disabled>
    </div>
    <div class="field hidden" id="confirm-field">
      <label for="confirm">Повторите пароль</label>
      <input id="confirm" type="password" maxlength="128" disabled>
    </div>
    <div class="hidden" id="character-fields">
      <div class="section">Ваш персонаж</div>
      <div class="row" style="margin-top: 12px">
        <div>
          <label for="first">Имя</label>
          <input id="first" type="text" maxlength="16" placeholder="John" spellcheck="false" disabled>
        </div>
        <div>
          <label for="last">Фамилия</label>
          <input id="last" type="text" maxlength="16" placeholder="Smith" spellcheck="false" disabled>
        </div>
      </div>
      <p class="hint">Только латинские буквы, от 2 до 16 в каждом. Видно над головой и в чате.</p>
    </div>
    <div class="error" id="error" role="alert"></div>
    <button id="submit" type="submit" disabled>Войти</button>
    <p class="foot" id="foot"></p>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), username = $("username"), password = $("password"), confirm = $("confirm"), first = $("first"), last = $("last"), button = $("submit");
  const inputs = [username, password, confirm, first, last];
  let state = null;
  // The tab shown: the server's on every state it sends, the player's own between them.
  let mode = "login";

  const kUsername = /^[A-Za-z0-9_]{3,20}$/;
  const kNamePart = /^[A-Za-z]{2,16}$/;

  function render() {
    const registering = mode === "register";
    $("title").textContent = registering ? "Добро пожаловать в Содружество" : "С возвращением";
    $("lead").textContent = registering ? "Придумайте логин и пароль и назовите своего персонажа." : "Войдите по логину, чтобы продолжить с того места, где остановились.";
    $("tab-login").classList.toggle("active", !registering);
    $("tab-register").classList.toggle("active", registering);
    $("username-hint").classList.toggle("hidden", !registering);
    $("confirm-field").classList.toggle("hidden", !registering);
    $("character-fields").classList.toggle("hidden", !registering);
    button.textContent = registering ? "Создать аккаунт" : "Войти";
    button.classList.toggle("busy", state.busy);
    $("foot").textContent = !registering && state.attemptsLeft < 5 ? `Осталось попыток: ${state.attemptsLeft}` : "";

    const locked = state.busy || state.done;
    for (const input of inputs) input.disabled = locked;
    button.disabled = $("tab-login").disabled = $("tab-register").disabled = locked;
    document.body.classList.toggle("done", state.done);
  }

  function focusFirstEmpty() {
    const order = mode === "register" ? [username, password, confirm, first, last] : [username, password];
    (order.find((input) => !input.value.trim()) || order[order.length - 1]).focus();
  }

  window.addEventListener("login:state", (event) => {
    state = event.detail;
    mode = state.mode;
    if (!username.value && state.username) {
      username.value = state.username;
    }
    $("error").textContent = state.error || "";
    if (state.error) {
      password.value = "";
      confirm.value = "";
    }
    render();
    if (!state.busy && !state.done) {
      focusFirstEmpty();
    }
  });

  const switchTo = (next) => {
    if (state === null || state.busy || state.done || mode === next) {
      return;
    }
    mode = next;
    $("error").textContent = "";
    render();
    focusFirstEmpty();
  };
  $("tab-login").addEventListener("click", () => switchTo("login"));
  $("tab-register").addEventListener("click", () => switchTo("register"));

  const fail = (message, input) => {
    $("error").textContent = message;
    input.focus();
  };

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (state === null || state.busy || state.done) {
      return;
    }
    const name = username.value.trim();
    const registering = mode === "register";
    if (!kUsername.test(name)) {
      return fail("Логин: от 3 до 20 латинских букв, цифр или _", username);
    }
    if (registering && name.toLowerCase() === "player") {
      return fail("Придумайте свой логин, Player занят по умолчанию", username);
    }
    if (!password.value) {
      return fail("Введите пароль", password);
    }
    if (registering) {
      if (password.value.length < 6) {
        return fail("Пароль должен быть не короче 6 символов", password);
      }
      if (confirm.value !== password.value) {
        return fail("Пароли не совпадают", confirm);
      }
      if (!kNamePart.test(first.value.trim())) {
        return fail("Имя персонажа: от 2 до 16 латинских букв", first);
      }
      if (!kNamePart.test(last.value.trim())) {
        return fail("Фамилия персонажа: от 2 до 16 латинских букв", last);
      }
    }
    callEvent("login:submit", JSON.stringify({
      mode,
      username: name,
      password: password.value,
      confirm: registering ? confirm.value : "",
      characterName: registering ? `${first.value.trim()} ${last.value.trim()}` : "",
    }));
  });

  callEvent("login:ready", null);
</script>
</body>
</html>
